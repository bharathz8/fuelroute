services:
  redis:
    image: redis:7-alpine
    container_name: fuelroute-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuelroute-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-e94f1c7d2b8a4f6e3c0d8b5a1f2e4d6c8b0a2f4e6d8c0b2a4f6e8d0c2b4a6f8e}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TTL_SECONDS=3600
      - ANON_RATE_LIMIT=20/minute
      - USER_RATE_LIMIT=100/minute
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - ROUTING_PROVIDER=osrm
      - OSRM_BASE_URL=https://router.project-osrm.org
      - GEOCODING_PROVIDER=nominatim
      - NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
      - NOMINATIM_USER_AGENT=FuelRouteProduction/1.0 (contact@fuelroute.local)
      - HTTP_TIMEOUT_SECONDS=10
      - ROUTE_CORRIDOR_MILES=25
      - MAX_RANGE_MILES=500
      - MPG=10
      - STARTING_TANK=full
      - MAP_STYLE_URL=https://tiles.openfreemap.org/styles/liberty
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
